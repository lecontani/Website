<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <radialGradient id="voidCore" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="12%" stop-color="#d4d4d8" stop-opacity="0.6" />
      <stop offset="32%" stop-color="#3f3f46" stop-opacity="0.25" />
      <stop offset="68%" stop-color="#18181b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#050507" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="ringGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#71717a" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#e4e4e7" stop-opacity="0.75" />
    </linearGradient>
    <pattern id="gridPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.06" />
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#060608" />
  <rect width="1600" height="900" fill="url(#gridPattern)" />
  <circle cx="800" cy="450" r="560" fill="url(#voidCore)" />

  <!-- Concentric Singularity Accretion Rings -->
  <g transform="translate(800, 450) rotate(-18)">
    <ellipse cx="0" cy="0" rx="580" ry="190" fill="none" stroke="url(#ringGlow)" stroke-width="1.5" stroke-dasharray="14 8" />
    <ellipse cx="0" cy="0" rx="460" ry="145" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" />
    <ellipse cx="0" cy="0" rx="340" ry="105" fill="none" stroke="url(#ringGlow)" stroke-width="3" />
    <ellipse cx="0" cy="0" rx="220" ry="68" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2.5" />
    <circle cx="0" cy="0" r="54" fill="#050507" stroke="#ffffff" stroke-width="4" />
    <circle cx="0" cy="0" r="68" fill="none" stroke="#a1a1aa" stroke-width="1" stroke-dasharray="4 6" />
  </g>

  <!-- Brutalist Orbital Gate Pillars -->
  <g stroke="#e4e4e7" stroke-opacity="0.5" fill="#0c0c10">
    <polygon points="210,160 265,140 265,760 210,740" />
    <polygon points="1390,160 1335,140 1335,760 1390,740" />
    <polygon points="310,240 340,230 340,670 310,660" />
    <polygon points="1290,240 1260,230 1260,670 1290,660" />
  </g>

  <!-- Reconnaissance Vessel Silhouette & Trajectory -->
  <path d="M 420 680 Q 610 560 720 490" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="6 6" />
  <g transform="translate(420, 680) rotate(-32)">
    <polygon points="0,-28 64,0 0,28 14,0" fill="#ffffff" />
    <polygon points="-26,-10 8,0 -26,10" fill="#a1a1aa" />
  </g>

  <!-- Telemetry HUD Framing (Concept Schematic Overlay) -->
  <g font-family="monospace" font-size="13" fill="#a1a1aa" opacity="0.75">
    <text x="90" y="95">SECTOR // SINGULARITY_HORIZON_09</text>
    <text x="90" y="118">GRAV_WELL_DENSITY: 94.82 KN/M</text>
    <text x="1260" y="95">CONCEPT_SCHEMATIC // AETHER-03</text>
    <text x="1260" y="118">THRUST_VECTOR: LOCKED</text>
    <rect x="85" y="790" width="240" height="36" fill="none" stroke="#52525b" stroke-width="1" />
    <text x="102" y="813" fill="#e4e4e7">KINETIC HARVEST: 78%</text>
  </g>
</svg>

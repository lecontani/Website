<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090c" />
      <stop offset="50%" stop-color="#111116" />
      <stop offset="100%" stop-color="#060608" />
    </linearGradient>
    <pattern id="fineGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.07" />
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bgGrad)" />
  <rect width="1600" height="900" fill="url(#fineGrid)" />

  <!-- Architectural Render Pipeline Nodes -->
  <g stroke="#ffffff" fill="none">
    <!-- Left Node: Geometry & Tilemap Pass -->
    <rect x="140" y="250" width="320" height="400" rx="12" fill="#0e0e12" stroke="#52525b" stroke-width="2" />
    <line x1="140" y1="320" x2="460" y2="320" stroke="#3f3f46" stroke-width="1.5" />
    <polygon points="300,380 390,435 300,490 210,435" stroke="#e4e4e7" stroke-width="2" fill="#18181b" />
    <polygon points="300,420 390,475 300,530 210,475" stroke="#a1a1aa" stroke-width="1.5" stroke-dasharray="5 5" />
    <polygon points="300,460 390,515 300,570 210,515" stroke="#71717a" stroke-width="1.5" />

    <!-- Center Node: Volumetric 2D/3D Lighting Shader -->
    <rect x="640" y="190" width="340" height="520" rx="12" fill="#0e0e12" stroke="#ffffff" stroke-width="2.5" />
    <line x1="640" y1="265" x2="980" y2="265" stroke="#52525b" stroke-width="1.5" />
    <circle cx="810" cy="460" r="130" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" />
    <circle cx="810" cy="460" r="92" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="8 6" />
    <circle cx="810" cy="460" r="52" fill="#ffffff" fill-opacity="0.92" />
    <line x1="810" y1="300" x2="810" y2="620" stroke="#ffffff" stroke-opacity="0.3" />
    <line x1="650" y1="460" x2="970" y2="460" stroke="#ffffff" stroke-opacity="0.3" />

    <!-- Right Node: Target Frame Pacing (PC & Android) -->
    <rect x="1150" y="250" width="320" height="400" rx="12" fill="#0e0e12" stroke="#52525b" stroke-width="2" />
    <line x1="1150" y1="320" x2="1470" y2="320" stroke="#3f3f46" stroke-width="1.5" />
    <polyline points="1190,520 1230,490 1270,505 1310,420 1350,435 1390,380 1430,390" stroke="#ffffff" stroke-width="3" fill="none" />
    <line x1="1190" y1="560" x2="1430" y2="560" stroke="#52525b" stroke-width="1" />

    <!-- Connecting Data Conduit Lines -->
    <path d="M 460 450 L 640 450" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="10 6" />
    <path d="M 980 450 L 1150 450" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="10 6" />
  </g>

  <g font-family="monospace" font-size="15" fill="#e4e4e7">
    <text x="175" y="292">01 // GEOMETRY &amp; COLLISION</text>
    <text x="675" y="235">02 // LIGHTING &amp; SHADER PASS</text>
    <text x="1185" y="292">03 // CROSS-PLATFORM OUTPUT</text>
    <text x="1190" y="605" fill="#a1a1aa" font-size="13">TARGET: PC (WIN) + ANDROID</text>
  </g>
</svg>

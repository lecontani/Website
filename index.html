<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Myltrix — Independent Game Studio</title>
    <meta
      name="description"
      content="Myltrix is an independent game studio creating original games for Windows and Android, including Moonbound."
    />
    <meta name="author" content="Myltrix" />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Myltrix" />
    <meta property="og:title" content="Myltrix — Independent Game Studio" />
    <meta
      property="og:description"
      content="Independent game studio creating original projects for PC and Android. Discover Moonbound on itch.io."
    />

    <!-- Favicon (dynamically synced with active theme in ThemeContext) -->
    <link rel="icon" type="image/png" href="./images/logo/myltrix-logo-white.png" />

    <!-- Typography: Inter & Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Prevent Theme Flash Before Hydration -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('myltrix-theme');
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.setAttribute('data-theme', saved);
          } else {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

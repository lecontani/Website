<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Myltrix — Independent Game Studio | PC &amp; Android</title>
    <meta
      name="description"
      content="Myltrix is an independent game development studio crafting atmospheric, mechanically precise video games for PC (Windows) and Android."
    />
    <meta
      name="keywords"
      content="Myltrix, independent game studio, indie games, PC games, Android games, game development, action platformer, stealth strategy"
    />
    <meta name="author" content="Myltrix" />
    <meta name="theme-color" content="#09090b" />

    <!-- Open Graph / Social Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Myltrix" />
    <meta property="og:title" content="Myltrix — Independent Game Development Studio" />
    <meta
      property="og:description"
      content="Precision-Crafted Worlds. Engineered for Immersion. Discover original games in development by Myltrix for PC and Android."
    />
    <meta property="og:image" content="/images/logo/myltrix-logo-badge.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Myltrix — Independent Game Development Studio" />
    <meta
      name="twitter:description"
      content="Independent game studio creating atmospheric video games for PC and Android."
    />
    <meta name="twitter:image" content="/images/logo/myltrix-logo-badge.jpg" />

    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="/images/logo/myltrix-logo-badge.jpg" />
    <link rel="apple-touch-icon" href="/images/logo/myltrix-logo-badge.jpg" />

    <!-- Google Fonts: Inter, Space Grotesk, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Myltrix",
        "description": "Independent video game development studio building games for PC and Android.",
        "logo": "/images/logo/myltrix-logo-badge.jpg",
        "sameAs": [
          "https://itch.io/",
          "https://github.com/"
        ]
      }
    </script>

    <!-- Prevent Theme Flash Before Hydration -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('myltrix-theme');
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.setAttribute('data-theme', saved);
          } else {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
